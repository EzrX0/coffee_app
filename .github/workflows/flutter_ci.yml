name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        cache: true

    - name: Get Dependencies
      run: flutter pub get
      working-directory: my_app

    - name: Analyze
      run: flutter analyze
      working-directory: my_app

    - name: Run Tests
      run: flutter test
      working-directory: my_app

    - name: Build APK (debug)
      run: flutter build apk --debug
      working-directory: my_app

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: my_app/build/app/outputs/flutter-apk/app-debug.apk