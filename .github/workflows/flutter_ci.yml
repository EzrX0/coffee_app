name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get
      working-directory: my_app

    - name: Run Tests
      run: flutter test
      working-directory: my_app

    - name: Build Web
      run: flutter build web
      working-directory: my_app
